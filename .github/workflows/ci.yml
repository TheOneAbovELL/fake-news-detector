name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit & API tests
        run: pytest
      - name: Training + app smoke test (synthetic data, offline)
        run: |
          python main.py --data synthetic --no-plots --no-cv --models-dir /tmp/models
          MODELS_DIR=/tmp/models python -c "
          from app import create_app
          c = create_app().test_client()
          assert c.get('/readyz').status_code == 200
          r = c.post('/api/verify-text', json={'text': 'BREAKING: secret plot exposed'})
          assert r.status_code == 200, r.data
          print(r.get_json()['verdict'])
          "

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (downloads FakeNewsNet and trains)
        run: docker build -t truthlens:ci .
      - name: Container health check
        run: |
          docker run -d --name tl -p 8000:8000 truthlens:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && break; sleep 2; done
          curl -fs -X POST http://localhost:8000/api/verify-text \
            -H 'Content-Type: application/json' \
            -d '{"text":"Pope Francis endorses Donald Trump for president"}'
          docker logs tl
