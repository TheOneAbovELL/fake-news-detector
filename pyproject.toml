[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
    "ignore::FutureWarning:sklearn.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# E402: entry-point scripts adjust sys.path before importing src.*
per-file-ignores = { "app.py" = ["E402"], "main.py" = ["E402"], "verify.py" = ["E402"], "tests/test_pipeline.py" = ["E402"] }
